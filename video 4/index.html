<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms - lets learn it</title>
</head>

<body>
    <h1>form to apply for sigma web developmemt course - TA</h1>

    <form action="post">
        <lable for="username">enter user name</lable>
        <input type="text" id="username" name="username" placeholder="Enter your username">
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="newsletter">
            <label for="subscribe">Subscribe to newsletter</label>
        </div>
        <div>
            <label for="country">Select your country:</label>
            <select id="country" name="country">
                <option value="usa">USA</option>
                <option value="uk">UK</option>
                <option value="india">India</option>
                <option value="canada">Canada</option>
            </select>
        </div>
        <div>
            <label for="comment">enter your comments</label>
            <textarea id="comment" name="comment" rows="4" cols="50" placeholder="Enter your comments here..."></textarea>
        </div>
    </form>
</body>

</html>
