<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Audio Example</title>
</head>

<body>
    <div>
        <h1>Video and Audio Example</h1>
        <video src="WhatsApp Video 2026-07-24 at 7.08.47 PM.mp4" width="320" height="240" controls loop
            poster="Master1.jpg">
        </video>
    </div>
    <div>
        <audio src="audio.mp3" controls></audio>
    </div>
    <div>
        <svg width="100" height="100">
            <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
        </svg>
    </div>
    <div>
        <img src="img.svg" alt="SVG Image" width="100" height="100">
    </div>
    <div>
        <iframe src="https://www.codewithharry.com/tutorial/html-iframes/"></iframe>
    </div>
    <div>

        <iframe width="560" height="315"
            src="https://www.youtube.com/embed/tVzUXW6siu0?si=NuQZuYqrMHn7Pg-1&amp;start=739"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write;encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
    </div>
</body>

</html>
