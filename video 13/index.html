<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>css selectors</title>
    <style>
      /* element selector */
      /* div {

       /* class selector */
      .red {
        background-color:red
      }
      /* id selector */
      #green {
        background-color: green;
      }
      /* child selector */
      /* div > p {

        background-color: rgb(208, 208, 212);
      } */
       /* descendant selector */
        div p {
            color: rgb(38, 12, 210);
            background-color: rgb(208, 208, 212);
        }
        /* universal selector */
        * {
            margin: 0;
            padding: 0;
        }
        /* pseudo selector */

        }

         p:first-child {
            color: rgb(195, 21, 21);

  </head>
  <body>

        i am a div
