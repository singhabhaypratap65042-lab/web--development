<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline and block elements</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p>This is a paragraph. It is a block-level element. </p>
    <a href="https://google.com">google</a>
    <div>This is a div. It is also a block-level element.</div>
    <span>This is a span. It is an inline element.</span>
</body>

</html>
