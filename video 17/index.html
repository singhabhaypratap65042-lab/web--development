<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>specificity</title>
    <style>
        /* the specificity this selector is 10+1=11 */
        h1.yellow {
           color: yellow;
        }
         /* the specificity this selector is 10 */
        .cred {
            color: red;
        }
         /* the specificity this selector is 10 */
        .cpurple {
            color: purple;
        }
        /* this is example of attribute selector.the specificity of this selector is 10  */
        [data-x="a"] {
            color: green;
        }
        /* this is example of pseudo class selector.the specificity of this selector is 1+10+10+10+10=41 */
        /* a.abhayclass.rohan-class[href]:hover {
            color: blue;
        } */
    </style>
</head>
<body>
    <div>
        <h1  class="yellow cred cpurple" data-x="a"> css specificity</h1>
    </div>
</body>
</html>
